name: CI
on:
  push:
    branches:
      - main
      - dev
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    # lts collects coverage (below), the slowest job
    timeout-minutes: ${{ matrix.version == 'lts' && 120 || 90 }}
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # The whole suite (test/runtests.jl) needs SCTL.jl: every Gauss-Legendre panel's near quadrature is SCTL's, and
      # the SCTL operator backends (DielectricBIESCTLExt) are tested. SCTL.jl is not registered, so it cannot be a test
      # dependency (Pkg.test cannot see it): the tests run from a shared environment holding the package, SCTL.jl
      # (cloned from GitHub, its C++ shim compiled here) and every package the tests load directly.
      - name: Install DielectricBIE, SCTL.jl and the test dependencies
        shell: julia --project=@sctl --color=yes {0}
        env:
          # GitHub runners may lack AVX-512: build the shim for a portable x86-64 baseline instead of -march=native
          SCTL_JL_MARCH: -march=x86-64-v3
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path = pwd()))
          # Pkg.add(url) fails on SCTL.jl's git submodules; a develop clone builds from the pinned sources
          Pkg.develop(url = "https://github.com/xuanzhaogao/SCTL.jl")
          # SCTL.jl is not pinned (its owner is this package's): the log names the commit tested
          sctl = only(d.source for d in values(Pkg.dependencies()) if d.name == "SCTL")
          run(`git -C $sctl log -1 "--format=SCTL.jl commit %H (%cd)"`)
          # what test/ (and the extensions it loads) use or import directly, as the package's own test target does
          Pkg.add(["Test", "Random", "LinearAlgebra", "SparseArrays", "Serialization", "Distributed", "SlurmClusterManager",
                   "FastGaussQuadrature", "HCubature", "Krylov", "LegendrePolynomials", "SpecialFunctions", "StaticArrays"])
          Pkg.build("SCTL")
      - name: Run the tests
        # OpenMP codes (FMM3D, FMM2D, FINUFFT and SCTL) get 2 threads, the runner's cores: unset, each call starts one per
        # core. Coverage makes the suite 4x slower on Julia 1.13 (74 min with it, 18 without), so it is collected on the
        # lts job only: one report is enough for Codecov. The lts job runs one Julia thread: the coverage counters are
        # shared, and two threads running the same lines contend for them (the curved GCQ rows of near_corrections,
        # threaded: over 20x slower than with one thread on Julia 1.10; 2.3x slower than without coverage with one).
        # The `1` job checks bounds (the @inbounds sites).
        run: >-
          julia --project=@sctl -t ${{ matrix.version == 'lts' && '1' || '2' }} --color=yes
          --code-coverage=${{ matrix.version == 'lts' && 'user' || 'none' }}
          ${{ matrix.version == '1' && '--check-bounds=yes' || '' }} test/runtests.jl
        env:
          OMP_NUM_THREADS: 2
      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ !cancelled() && matrix.version == 'lts' }}
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() && matrix.version == 'lts' }}
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using DielectricBIE
          DocMeta.setdocmeta!(DielectricBIE, :DocTestSetup, :(using DielectricBIE); recursive=true)
          doctest(DielectricBIE)
